
name: Build VideoLoop MP4 V5 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract V5 Android Project
        shell: bash
        run: |
          set -e

          ZIP="VideoLoopMP4-V5-project.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          PROJECT=$(find extracted -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          cp -a "$PROJECT_DIR"/. .

          echo "Android project extracted successfully"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable AndroidX
        shell: bash
        run: |
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build APK
        shell: bash
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoLoop-MP4-V5-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
