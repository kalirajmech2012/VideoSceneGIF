
name: Build VideoSceneGIF APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir -p extracted
          unzip -o VideoSceneGIF-project..zip -d extracted

          PROJECT=$(find extracted -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          cp -a "$PROJECT_DIR"/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoSceneGIF-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
